<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoAid - Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { color: #1a1a1a; background: #f6f7f9; }

  /* Navbar */
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 60px;
    border-bottom: 1px solid #eee;
    background: #fff;
  }
  .logo {
    font-size: 24px;
    font-weight: 700;
    color: #1e3a5f;
    text-decoration: none;
  }
  .logo span { color: #e8590c; }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .btn-solid {
    padding: 10px 22px;
    border-radius: 6px;
    font-weight: 600;
    text-decoration: none;
    background: #1a1a1a;
    color: #fff;
  }

  /* Login box */
  .login-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 80px 20px;
  }
  .login-card {
    background: #fff;
    width: 100%;
    max-width: 420px;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .login-card h1 {
    font-size: 26px;
    margin-bottom: 6px;
    text-align: center;
  }
  .login-card p.subtitle {
    color: #777;
    font-size: 14px;
    margin-bottom: 30px;
    text-align: center;
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
  }
  .form-group input:focus {
    outline: none;
    border-color: #e8590c;
  }

  .remember-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .remember-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #555;
  }
  .remember-row a {
    color: #e8590c;
    text-decoration: none;
    font-weight: 600;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-customer {
    background: #e8590c;
    color: #fff;
  }
  .btn-customer:hover { background: #d14e0a; }

  .btn-mechanic {
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #1a1a1a;
    margin-top: 12px;
  }
  .btn-mechanic:hover { background: #f1f1f1; }

  .register-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #555;
  }
  .register-link a {
    color: #e8590c;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Auto<span>Aid</span></a>
    <div class="nav-links">
      <a href="register.html" class="btn-solid">Get Started</a>
    </div>
  </nav>

  <div class="login-wrap">
    <div class="login-card">
      <h1>Welcome Back to AutoAid</h1>
      <p class="subtitle">Sign in to your account to manage your roadside requests</p>

      <form onsubmit="return false;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="remember-row">
          <label><input type="checkbox">Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="button" class="submit-btn btn-customer" onclick="loginCustomer()">Sign In as Customer</button>
        <button type="button" class="submit-btn btn-mechanic" onclick="loginProvider()">Sign In as Mechanic</button>
      </form>

      <p class="register-link">Don't have an account? <a href="register.html">Sign up here</a></p>
    </div>
  </div>

  <script>
    function loginCustomer() {
      window.location.href = 'customer/dashboard.html';
    }

    function loginProvider() {
      window.location.href = 'provider/dashboard.html';
    }
  </script>

</body>
</html>
